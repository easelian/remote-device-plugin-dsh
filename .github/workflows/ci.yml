name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run style:check
      - run: npm run check
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - run: npm run test:keyring
      - name: Check committed ESM matches TypeScript
        run: git diff --exit-code -- index.js permissions.js client.js bin scripts
